name: Ping backend health

on:
  schedule:
    - cron: "*/14 * * * *" # every 14 minutes (Render free tier sleeps after 15 min)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          set -euo pipefail
          URL="https://game-platform-n1k1.onrender.com/health"
          echo "Pinging $URL to keep Render instance active..."
          
          for i in {1..3}; do
            STATUS=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" "$URL" || echo 0)
            echo "Attempt $i: Status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check succeeded! Backend is awake."
              exit 0
            fi
            sleep 15
          done
          
          echo "::warning title=Render Ping Warning::Backend endpoint did not respond with 200 OK. Render backend may be restarting or down."
          exit 0

