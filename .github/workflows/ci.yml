name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build backend (Maven)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run frontend tests (if any)
        working-directory: frontend
        run: |
          if npm test --silent; then echo "frontend tests passed"; else echo "no frontend tests or tests failed"; fi
